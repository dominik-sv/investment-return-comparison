<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holding-period return distributions</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #0969da; --card: #f6f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; font: 14px/1.5 -apple-system, BlinkMacSystemFont,
    "Segoe UI", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--bg);
    max-width: 1200px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--bg); color: var(--fg); padding: 7px 14px; cursor: pointer;
    font: inherit; border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid + .grid { margin-top: 14px; }
  .card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 6px; }
  .plot { width: 100%; height: 340px; }
  #statsbar { margin: 14px auto; max-width: 720px; }
  #statsbar table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #statsbar th, #statsbar td { padding: 6px 14px; text-align: right; border-bottom: 1px solid var(--border); }
  #statsbar thead th { font-weight: 700; }
  #statsbar tbody th { text-align: left; font-weight: 500; color: var(--muted); }
  .sliderbox { margin: 18px 2px 4px; }
  .sliderrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .sliderbox label { font-weight: 600; }
  #modeToggle button { padding: 5px 12px; font-size: 13px; }
  .sliderbox .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 22px; }
  .foot a { color: var(--accent); }
  #status { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>Holding-period return distributions</h1>
<p class="sub">US equities vs. cash, every start date 1926&ndash;2025, by how long you hold. Overlapping windows from Ken French (market, 1&#8209;month T&#8209;bill) and BLS CPI.</p>

<div id="status">Loading&hellip;</div>

<div id="app" hidden>
  <div class="controls">
    <div class="seg" id="viewToggle" role="group" aria-label="View"></div>
    <span class="sub" id="viewNote"></span>
  </div>

  <div class="grid">
    <div class="card"><div id="fan" class="plot"></div></div>
    <div class="card"><div id="pbz" class="plot"></div></div>
  </div>

  <div id="statsbar"></div>

  <div class="grid">
    <div class="card"><div id="hist" class="plot"></div></div>
    <div class="card"><div id="bar" class="plot"></div></div>
  </div>

  <div class="sliderbox">
    <div class="sliderrow">
      <label for="hslider">Holding period: <span class="val" id="hlabel"></span></label>
      <span class="seg" id="modeToggle" role="group" aria-label="Distribution view">
        <button data-mode="pdf" aria-pressed="true">PDF</button>
        <button data-mode="cdf" aria-pressed="false">CDF</button>
      </span>
    </div>
    <input type="range" id="hslider" min="0" max="0" value="0" step="1">
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
"use strict";

const CLR = {
  excess_wealth: "#0969da",
  real_market:   "#0969da",
  real_tbill:    "#bc4c00",
};
const EDGE_CLR = "#cf222e";   // bottom-10% / top-10% (red)
const MEAN_CLR = "#24292f";   // mean line on the distribution panels
const fmtPct = v => (v == null ? "–" : v.toFixed(1) + "%");
const shortLabel = name => DATA[name].label.split(" — ")[0];
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};

const state = { viewKey: null, hIdx: 0, mode: "pdf" };   // mode: "pdf" | "cdf"
let META = null;
const DATA = {};                 // series name -> payload

const $ = id => document.getElementById(id);

async function boot() {
  META = await fetch("data/meta.json").then(r => r.json());
  const names = Object.keys(META.series_labels);
  await Promise.all(names.map(async n => { DATA[n] = await fetch(`data/${n}.json`).then(r => r.json()); }));

  // view toggle
  const tog = $("viewToggle");
  Object.entries(META.views).forEach(([key, v], i) => {
    const b = document.createElement("button");
    b.textContent = v.label;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.onclick = () => setView(key);
    b.dataset.key = key;
    tog.appendChild(b);
    if (i === 0) state.viewKey = key;
  });

  const anySeries = DATA[activeSeries()[0]];
  const nHist = anySeries.hist.horizons_days.length;
  const sl = $("hslider");
  sl.max = nHist - 1;
  state.hIdx = Math.round(nHist * 0.55);
  sl.value = state.hIdx;
  sl.addEventListener("input", () => { state.hIdx = +sl.value; renderDynamic(); });

  document.querySelectorAll("#modeToggle button").forEach(b => {
    b.onclick = () => {
      state.mode = b.dataset.mode;
      document.querySelectorAll("#modeToggle button").forEach(x =>
        x.setAttribute("aria-pressed", x === b ? "true" : "false"));
      renderDynamic();
    };
  });

  $("status").hidden = true;
  $("app").hidden = false;
  setView(state.viewKey);
}

function setView(key) {
  state.viewKey = key;
  document.querySelectorAll("#viewToggle button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.key === key ? "true" : "false"));
  $("viewNote").textContent = META.views[key].series.map(n => DATA[n].label).join("   vs.   ");
  renderStatic();
  renderDynamic();
}

const activeSeries = () => META.views[state.viewKey].series;
const isSplit = () => activeSeries().length === 2;   // 2-series view -> market | risk-free columns
const dailyIndexForHist = (s, hIdx) =>
  s.horizons_days.indexOf(s.hist.horizons_days[hIdx]);
const hYears = () => DATA[activeSeries()[0]].hist.horizons_years[state.hIdx];

// ---- fan chart --------------------------------------------------------
const FAN_LV = [5, 10, 20, 30, 40, 60, 70, 80, 90, 95];   // 9 rings around the median
const FAN_A = [.09, .13, .18, .25, .34, .25, .18, .13, .09]; // 5 symmetric shade levels

function fanTraces(name) {
  const s = DATA[name], x = s.horizons_years, c = CLR[name];
  const t = [{ x, y: s.percentiles[FAN_LV[0]], mode: "lines", line: { width: 0 },
               hoverinfo: "skip", showlegend: false }];
  for (let k = 1; k < FAN_LV.length; k++) {
    t.push({ x, y: s.percentiles[FAN_LV[k]], mode: "lines", line: { width: 0 },
             fill: "tonexty", fillcolor: rgba(c, FAN_A[k - 1]),
             hoverinfo: "skip", showlegend: false });
  }
  t.push({ x, y: s.percentiles[50], mode: "lines", name: shortLabel(name),
           line: { color: c, width: 1.8 },
           hovertemplate: "%{x:.1f} yr  median %{y:.1f}<extra></extra>" });
  return t;
}

function fanY(...names) {
  const lo = Math.min(0, ...names.flatMap(n => DATA[n].percentiles[5].filter(Number.isFinite)));
  const hi = Math.max(...names.flatMap(n => DATA[n].percentiles[95].filter(Number.isFinite)));
  return [lo < 0 ? lo * 1.15 : 0, hi * 1.1];
}

function renderFan(div, name, title, yrange) {
  const s = DATA[name];
  Plotly.react(div, fanTraces(name), {
    margin: { t: 34, r: 14, b: 40, l: 56 },
    title: { text: title, font: { size: 13 } },
    xaxis: { title: "Holding period (years)", zeroline: false, dtick: 1 },
    yaxis: { title: s.unit, zeroline: true, zerolinecolor: "#c8c8c8",
             range: yrange || fanY(name), autorange: false },
    showlegend: false, shapes: [vline()],
  }, { displayModeBar: false, responsive: true });
}

// ---- P(window return < 0) curve ------------------------------------
function renderPbzCurve(div, name) {
  const s = DATA[name];
  Plotly.react(div, [{
    x: s.horizons_years, y: s.p_below_zero, mode: "lines",
    line: { color: CLR[name], width: 1.8 },
    hovertemplate: "%{x:.1f} yr  %{y:.1f}%<extra></extra>",
  }], {
    margin: { t: 34, r: 14, b: 40, l: 48 },
    title: { text: "P(window return < 0)", font: { size: 13 } },
    xaxis: { title: "Holding period (years)", zeroline: false, dtick: 1 },
    yaxis: { title: "%", range: [0, 100], ticksuffix: "%" },
    showlegend: false, shapes: [vline()],
  }, { displayModeBar: false, responsive: true });
}

// ---- distribution panel: PDF (histogram) or CDF (step curve) ----------
function distDecor(h, i, aboveTop) {   // mean + p10/p90 lines, tail-mass / mean labels
  const mean = h.mean[i];
  const pLine = x => ({ type: "line", xref: "x", yref: "paper", x0: x, x1: x, y0: 0, y1: 1,
                        line: { color: EDGE_CLR, width: 1, dash: "dot" } });
  return {
    shapes: [
      { type: "line", xref: "x", yref: "paper", x0: mean, x1: mean, y0: 0, y1: 1,
        line: { color: MEAN_CLR, width: 2 } },
      pLine(h.p10[i]), pLine(h.p90[i]),
    ],
    annotations: [
      { xref: "paper", yref: "paper", x: 0.01, y: 0.98, xanchor: "left", yanchor: "top",
        showarrow: false, font: { size: 11, color: "#57606a" },
        text: "← " + h.below_pct[i].toFixed(1) + "% below" },
      { xref: "paper", yref: "paper", x: 0.99, y: aboveTop ? 0.98 : 0.04,
        xanchor: "right", yanchor: aboveTop ? "top" : "bottom",
        showarrow: false, font: { size: 11, color: "#57606a" },
        text: h.above_pct[i].toFixed(1) + "% above →" },
      { x: mean, y: 1, yref: "paper", yanchor: "bottom", showarrow: false,
        font: { size: 10, color: MEAN_CLR }, text: "mean" },
    ],
  };
}

function renderHist(div, name, title, opts = {}) {
  const s = DATA[name], i = state.hIdx, h = s.hist;
  const e = h.edges, counts = h.counts[i], n = h.n[i];
  const cx = counts.map((_, k) => (e[k] + e[k + 1]) / 2);
  const w = counts.map((_, k) => e[k + 1] - e[k]);
  const p10 = h.p10[i], p90 = h.p90[i];
  const colors = cx.map(x => (x < p10 || x > p90) ? EDGE_CLR : rgba(CLR[name], 0.55));
  const dec = distDecor(h, i, true);
  const yax = { title: "probability", tickformat: ".1%" };
  if (opts.yr) { yax.range = opts.yr; yax.autorange = false; } else { yax.rangemode = "tozero"; }
  Plotly.react(div, [{
    type: "bar", x: cx, y: counts.map(c => c / n), width: w,
    marker: { color: colors, line: { width: 0 } },
    hovertemplate: "%{x:.0f}  %{y:.2%}<extra></extra>",
  }], {
    bargap: 0.02, margin: { t: 34, r: 14, b: 40, l: 52 },
    title: { text: title, font: { size: 13 } },
    xaxis: { title: s.unit, range: opts.xr || [e[0], e[e.length - 1]], autorange: false,
             zeroline: true, zerolinecolor: "#c8c8c8" },
    yaxis: yax,
    shapes: dec.shapes, annotations: dec.annotations, showlegend: false,
  }, { displayModeBar: false, responsive: true });
}

function renderCdf(div, name, title, opts = {}) {
  const s = DATA[name], i = state.hIdx, h = s.hist;
  const e = h.edges, counts = h.counts[i], n = h.n[i];
  const xr = opts.xr || [e[0], e[e.length - 1]];
  const lo = xr[0], hi = xr[1];
  const c10 = Math.max(lo, Math.min(hi, h.p10[i]));
  const c90 = Math.max(lo, Math.min(hi, h.p90[i]));

  // cumulative probability at each bin edge
  let cum = h.below_pct[i] / 100;
  const ex = [e[0]], ey = [cum];
  for (let k = 0; k < counts.length; k++) { cum += counts[k] / n; ex.push(e[k + 1]); ey.push(cum); }
  const yAt = x => { let v = ey[0]; for (let k = 0; k < ex.length; k++) { if (ex[k] <= x) v = ey[k]; else break; } return v; };
  const seg = (x0, x1) => {
    if (x1 <= x0) return null;
    const xs = [x0], yy = [yAt(x0)];
    for (let k = 0; k < ex.length; k++) if (ex[k] > x0 && ex[k] < x1) { xs.push(ex[k]); yy.push(ey[k]); }
    xs.push(x1); yy.push(yAt(x1));
    return { x: xs, y: yy };
  };
  const mk = (d, col) => d && {
    x: d.x, y: d.y, mode: "lines", line: { color: col, width: 2, shape: "hv" },
    hovertemplate: "%{x:.0f}  %{y:.1%}<extra></extra>", showlegend: false,
  };
  const traces = [mk(seg(lo, c10), EDGE_CLR), mk(seg(c10, c90), CLR[name]),
                  mk(seg(c90, hi), EDGE_CLR)].filter(Boolean);

  const dec = distDecor(h, i, false);
  const bands = [[lo, c10], [c90, hi]].map(([x0, x1]) => ({
    type: "rect", xref: "x", yref: "paper", x0, x1, y0: 0, y1: 1, layer: "below",
    fillcolor: rgba(EDGE_CLR, 0.10), line: { width: 0 },
  }));
  Plotly.react(div, traces, {
    margin: { t: 34, r: 14, b: 40, l: 52 },
    title: { text: title, font: { size: 13 } },
    xaxis: { title: s.unit, range: xr, autorange: false, zeroline: true, zerolinecolor: "#c8c8c8" },
    yaxis: { title: "cumulative probability", range: [0, 1], tickformat: ".0%" },
    shapes: [...bands, ...dec.shapes], annotations: dec.annotations, showlegend: false,
  }, { displayModeBar: false, responsive: true });
}

const renderDist = (div, name, title, opts) =>
  (state.mode === "cdf" ? renderCdf : renderHist)(div, name, title, opts);

// ---- single-horizon P(<0) bar ------------------------------------
function renderPbzBar(div, name) {
  const s = DATA[name], v = s.p_below_zero[dailyIndexForHist(s, state.hIdx)];
  Plotly.react(div, [{
    type: "bar", x: ["P(return < 0)"], y: [v], text: [fmtPct(v)],
    textposition: "outside", cliponaxis: false, width: 0.4,
    marker: { color: rgba(CLR[name], 0.85) }, hoverinfo: "skip",
  }], {
    margin: { t: 34, r: 14, b: 40, l: 48 },
    title: { text: `P(return < 0) at ${hYears().toFixed(2)} yr`, font: { size: 13 } },
    yaxis: { title: "%", range: [0, 100], ticksuffix: "%" },
    xaxis: { automargin: true }, showlegend: false,
  }, { displayModeBar: false, responsive: true });
}

// ---- stats table (between the chart rows) — rows = series, cols = stats
function renderStats() {
  const series = activeSeries(), i = state.hIdx;
  const cols = [
    ["Mean", s => s.hist.mean[i], true],
    ["Std. dev.", s => s.hist.std[i], false],
    ["10th pct", s => s.hist.p10[i], true],
    ["90th pct", s => s.hist.p90[i], true],
  ];
  const fmt = (v, signed) => v == null ? "–"
    : (signed && v > 0 ? "+" : "") + v.toFixed(1) + "%";
  const head = "<tr><th></th>" + cols.map(([l]) => `<th>${l}</th>`).join("") + "</tr>";
  const body = series.map(n =>
    `<tr><th style="color:${CLR[n]}">${shortLabel(n)}</th>` +
    cols.map(([, get, signed]) => `<td>${fmt(get(DATA[n]), signed)}</td>`).join("") +
    `</tr>`).join("");
  $("statsbar").innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

// ---- orchestration --------------------------------------------------
function renderStatic() {
  const [a, b] = activeSeries();
  if (isSplit()) {
    const yr = fanY(a, b);                       // shared y-axis for the two fans
    renderFan("fan", a, shortLabel(a) + " — window return", yr);
    renderFan("pbz", b, shortLabel(b) + " — window return", yr);
  } else {
    renderFan("fan", a, "Distribution of the window return");
    renderPbzCurve("pbz", a);
  }
}

function renderDynamic() {
  const [a, b] = activeSeries();
  const s0 = DATA[a], i = state.hIdx, yr = hYears();
  $("hlabel").textContent = yr.toFixed(2) + " years  (" + s0.hist.horizons_days[i] + " days)";
  renderStats();

  if (isSplit()) {
    const ea = DATA[a].hist.edges, eb = DATA[b].hist.edges;
    const xr = [Math.min(ea[0], eb[0]), Math.max(ea[ea.length - 1], eb[eb.length - 1])];
    let ymax = 0;
    for (const nm of [a, b]) {
      const hh = DATA[nm].hist, nn = hh.n[i];
      ymax = Math.max(ymax, ...hh.counts[i].map(c => c / nn));
    }
    const opts = { xr, yr: [0, ymax * 1.12] };   // shared axes for the two dist panels
    renderDist("hist", a, `${shortLabel(a)} — at ${yr.toFixed(2)} yr`, opts);
    renderDist("bar", b, `${shortLabel(b)} — at ${yr.toFixed(2)} yr`, opts);
  } else {
    const kind = state.mode === "cdf" ? "Cumulative distribution" : "Return distribution";
    renderDist("hist", a, `${kind} at ${yr.toFixed(2)} yr`);
    renderPbzBar("bar", a);
  }

  const xAt = s0.horizons_years[dailyIndexForHist(s0, i)];
  Plotly.relayout("fan", { "shapes[0].x0": xAt, "shapes[0].x1": xAt });
  Plotly.relayout("pbz", { "shapes[0].x0": xAt, "shapes[0].x1": xAt });

  $("foot").innerHTML =
    `At this horizon: ${s0.hist.n[i].toLocaleString()} overlapping windows. Histogram x-axis is ` +
    `fixed across horizons; mass past each edge is shown top-left / top-right. ` +
    `Bottom &amp; top 10% in red (dotted lines = 10th / 90th percentile); black line = mean. ` +
    `<a href="https://github.com/dominik-sv/investment-return-comparison">source</a>.`;
}

function vline() {
  return { type: "line", xref: "x", yref: "paper", x0: 0, x1: 0, y0: 0, y1: 1,
           line: { color: "#8250df", width: 1.5, dash: "dot" } };
}

boot().catch(e => { $("status").textContent = "Failed to load: " + e.message; });
</script>
</body>
</html>
