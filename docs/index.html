<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holding-period return distributions</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --border: #d0d7de;
    --accent: #0969da; --card: #f6f8fa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px; font: 14px/1.5 -apple-system, BlinkMacSystemFont,
    "Segoe UI", Helvetica, Arial, sans-serif; color: var(--fg); background: var(--bg);
    max-width: 1200px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--bg); color: var(--fg); padding: 7px 14px; cursor: pointer;
    font: inherit; border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card { border: 1px solid var(--border); border-radius: 8px; background: var(--card); padding: 6px; }
  .plot { width: 100%; height: 340px; }
  .sliderbox { margin: 18px 2px 4px; }
  .sliderbox label { font-weight: 600; }
  .sliderbox .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 22px; }
  .foot a { color: var(--accent); }
  #status { padding: 40px; text-align: center; color: var(--muted); }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>Holding-period return distributions</h1>
<p class="sub">US equities vs. cash, every start date 1926&ndash;2025, by how long you hold. Overlapping windows from Ken French (market, 1&#8209;month T&#8209;bill) and BLS CPI.</p>

<div id="status">Loading&hellip;</div>

<div id="app" hidden>
  <div class="controls">
    <div class="seg" id="viewToggle" role="group" aria-label="View"></div>
    <span class="sub" id="viewNote"></span>
  </div>

  <div class="grid">
    <div class="card"><div id="fan" class="plot"></div></div>
    <div class="card"><div id="pbz" class="plot"></div></div>
    <div class="card"><div id="hist" class="plot"></div></div>
    <div class="card"><div id="bar" class="plot"></div></div>
  </div>

  <div class="sliderbox">
    <label for="hslider">Holding period: <span class="val" id="hlabel"></span></label>
    <input type="range" id="hslider" min="0" max="0" value="0" step="1">
  </div>

  <p class="foot" id="foot"></p>
</div>

<script>
"use strict";

const CLR = {
  excess_wealth: "#0969da",
  real_market:   "#0969da",
  real_tbill:    "#bc4c00",
};
const fmtPct = v => (v == null ? "–" : v.toFixed(1) + "%");
const shortLabel = name => DATA[name].label.split(" — ")[0];
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};

const state = { viewKey: null, hIdx: 0 };
let META = null;
const DATA = {};                 // series name -> payload

const $ = id => document.getElementById(id);

async function boot() {
  META = await fetch("data/meta.json").then(r => r.json());
  const names = Object.keys(META.series_labels);
  await Promise.all(names.map(async n => { DATA[n] = await fetch(`data/${n}.json`).then(r => r.json()); }));

  // view toggle
  const tog = $("viewToggle");
  Object.entries(META.views).forEach(([key, v], i) => {
    const b = document.createElement("button");
    b.textContent = v.label;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.onclick = () => setView(key);
    b.dataset.key = key;
    tog.appendChild(b);
    if (i === 0) state.viewKey = key;
  });

  const anySeries = DATA[activeSeries()[0]];
  const nHist = anySeries.hist.horizons_days.length;
  const sl = $("hslider");
  sl.max = nHist - 1;
  state.hIdx = Math.round(nHist * 0.55);
  sl.value = state.hIdx;
  sl.addEventListener("input", () => { state.hIdx = +sl.value; renderDynamic(); });

  $("status").hidden = true;
  $("app").hidden = false;
  setView(state.viewKey);
}

function setView(key) {
  state.viewKey = key;
  document.querySelectorAll("#viewToggle button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.key === key ? "true" : "false"));
  $("viewNote").textContent = META.views[key].series.map(n => DATA[n].label).join("   vs.   ");
  renderStatic();
  renderDynamic();
}

const activeSeries = () => META.views[state.viewKey].series;
const dailyIndexForHist = (s, hIdx) =>
  s.horizons_days.indexOf(s.hist.horizons_days[hIdx]);

// ---- fan chart + P(<0) curve (change only with the view) ----------------
function fanTraces(name, solo) {
  const s = DATA[name], x = s.horizons_years, c = CLR[name];
  const bands = solo ? [[5, 95, .10], [10, 90, .16], [25, 75, .28]]
                     : [[10, 90, .16]];
  const t = [];
  for (const [lo, hi, op] of bands) {
    t.push({ x, y: s.percentiles[lo], mode: "lines", line: { width: 0 },
             hoverinfo: "skip", showlegend: false });
    t.push({ x, y: s.percentiles[hi], mode: "lines", line: { width: 0 },
             fill: "tonexty", fillcolor: rgba(c, op),
             hoverinfo: "skip", showlegend: false });
  }
  t.push({ x, y: s.percentiles[50], mode: "lines", name: shortLabel(name),
           line: { color: c, width: 1.8 },
           hovertemplate: "%{x:.1f} yr  median %{y:.1f}<extra></extra>" });
  return t;
}

function renderStatic() {
  const series = activeSeries(), solo = series.length === 1;
  const unit = DATA[series[0]].unit;

  let ylo = 0, yhi = 0;
  for (const n of series) {
    const p = DATA[n].percentiles;
    yhi = Math.max(yhi, Math.max(...p[95].filter(Number.isFinite)));
    ylo = Math.min(ylo, Math.min(...p[5].filter(Number.isFinite)));
  }
  const fanRange = [ylo < 0 ? ylo * 1.15 : 0, yhi * 1.1];

  Plotly.react("fan", series.flatMap(n => fanTraces(n, solo)), {
    margin: { t: 34, r: 12, b: 40, l: 56 },
    title: { text: "Distribution of the window return", font: { size: 13 } },
    xaxis: { title: "Holding period (years)", zeroline: false },
    yaxis: { title: unit, zeroline: true, zerolinecolor: "#c8c8c8",
             range: fanRange, autorange: false },
    legend: { orientation: "h", y: -0.22 }, showlegend: !solo,
    shapes: [vline()],
  }, { displayModeBar: false, responsive: true });

  Plotly.react("pbz", series.map(n => ({
    x: DATA[n].horizons_years, y: DATA[n].p_below_zero, mode: "lines",
    name: shortLabel(n), line: { color: CLR[n], width: 1.8 },
    hovertemplate: "%{x:.1f} yr  %{y:.1f}%<extra></extra>",
  })), {
    margin: { t: 34, r: 12, b: 40, l: 48 },
    title: { text: "P(window return < 0)", font: { size: 13 } },
    xaxis: { title: "Holding period (years)", zeroline: false },
    yaxis: { title: "%", rangemode: "tozero", ticksuffix: "%" },
    legend: { orientation: "h", y: -0.22 }, showlegend: !solo,
    shapes: [vline()],
  }, { displayModeBar: false, responsive: true });
}

// ---- histogram + single-horizon bar (change with the slider) ----------
function histTrace(name) {
  const s = DATA[name], i = state.hIdx;
  const e = s.hist.edges[i], counts = s.hist.counts[i];
  const cx = counts.map((_, k) => (e[k] + e[k + 1]) / 2);
  const w = counts.map((_, k) => e[k + 1] - e[k]);
  return {
    type: "bar", x: cx, y: counts, width: w, name: s.label,
    marker: { color: rgba(CLR[name], 0.55), line: { width: 0 } },
    hovertemplate: "%{x:.0f}  &times;%{y}<extra></extra>",
  };
}

function renderDynamic() {
  const series = activeSeries(), solo = series.length === 1;
  const s0 = DATA[series[0]], i = state.hIdx;
  const yrs = s0.hist.horizons_years[i];
  $("hlabel").textContent = yrs.toFixed(2) + " years  (" + s0.hist.horizons_days[i] + " days)";

  // histogram
  Plotly.react("hist", series.map(histTrace), {
    barmode: "overlay", bargap: 0.02,
    margin: { t: 34, r: 12, b: 40, l: 48 },
    title: { text: `Return distribution at ${yrs.toFixed(2)} yr`, font: { size: 13 } },
    xaxis: { title: DATA[series[0]].unit, zeroline: true, zerolinecolor: "#c8c8c8" },
    yaxis: { title: "windows" },
    legend: { orientation: "h", y: -0.22 }, showlegend: !solo,
  }, { displayModeBar: false, responsive: true });

  // single-horizon P(<0) bar
  const bx = [], by = [], bt = [], bc = [];
  for (const n of series) {
    const j = dailyIndexForHist(DATA[n], i);
    const v = DATA[n].p_below_zero[j];
    bx.push(solo ? "P(return < 0)" : shortLabel(n));
    by.push(v); bt.push(fmtPct(v)); bc.push(CLR[n]);
  }
  Plotly.react("bar", [{
    type: "bar", x: bx, y: by, text: bt, textposition: "outside", cliponaxis: false,
    width: solo ? 0.4 : 0.55,
    marker: { color: bc.map(c => rgba(c, 0.85)) }, hoverinfo: "skip",
  }], {
    margin: { t: 34, r: 12, b: 40, l: 48 },
    title: { text: `P(return < 0) at ${yrs.toFixed(2)} yr`, font: { size: 13 } },
    yaxis: { title: "%", range: [0, Math.max(...by) * 1.3 || 1], ticksuffix: "%" },
    xaxis: { automargin: true },
  }, { displayModeBar: false, responsive: true });

  // move the vertical markers without a full redraw
  const xAt = s0.horizons_years[dailyIndexForHist(s0, i)];
  Plotly.relayout("fan", { "shapes[0].x0": xAt, "shapes[0].x1": xAt });
  Plotly.relayout("pbz", { "shapes[0].x0": xAt, "shapes[0].x1": xAt });

  const n = s0.hist.n[i], shown = s0.hist.counts[i].reduce((a, b) => a + b, 0);
  $("foot").innerHTML =
    `Window count at this horizon: ${n.toLocaleString()} overlapping start dates ` +
    `(${(100 * (1 - shown / n)).toFixed(1)}% of them fall in the clipped &plusmn;1% tails, off the histogram axis). ` +
    `Data &amp; method: <a href="https://github.com/dominik-sv/investment-return-comparison">github.com/dominik-sv/investment-return-comparison</a>.`;
}

function vline() {
  return { type: "line", xref: "x", yref: "paper", x0: 0, x1: 0, y0: 0, y1: 1,
           line: { color: "#8250df", width: 1.5, dash: "dot" } };
}

boot().catch(e => { $("status").textContent = "Failed to load: " + e.message; });
</script>
</body>
</html>
